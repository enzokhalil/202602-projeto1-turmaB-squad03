/* ===== Moldura iPhone SE (template do grupo) ===== */
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 28px;
  background: #e9ebef;
}
.iphone-se {
  position: relative;
  width: 411px;
  padding: 70px 18px;
  border-radius: 54px;
  background: #17191d;
  box-shadow: inset 0 0 0 2px #474a50, inset 0 0 0 7px #22252a,
    0 20px 60px #1018272e;
}
.iphone-se__screen {
  width: 375px;
  height: 667px;
  overflow: hidden;
  background: #f7f6f0;
}
.iphone-se__screen bulbe-app { --bulbe-app-height: 100%; }
.iphone-se__speaker {
  position: absolute;
  width: 48px;
  height: 5px;
  left: calc(50% - 24px);
  top: 32px;
  border-radius: 10px;
  background: #08090a;
}
.iphone-se__speaker::before {
  content: "";
  position: absolute;
  width: 8px;
  height: 8px;
  left: -24px;
  top: -2px;
  border-radius: 50%;
  background: #0a1221;
  box-shadow: inset 0 0 0 2px #050608;
}
.iphone-se__home {
  position: absolute;
  width: 42px;
  height: 42px;
  bottom: 14px;
  left: calc(50% - 21px);
  border: 2px solid #484b50;
  border-radius: 50%;
  background: #15171b;
}
/* No aparelho real, a prévia usa a própria tela, sem uma segunda moldura. */
@media (max-width: 430px) {
  body { display: block; padding: 0; background: #f7f6f0; }
  .iphone-se { width: 100%; padding: 0; border-radius: 0; box-shadow: none; }
  .iphone-se__screen { width: 100%; height: 100dvh; }
  .iphone-se__speaker, .iphone-se__home { display: none; }
}

/* ===== HU06 ===== */
/* HU06 — Atendimento e solicitações. Somente o conteúdo das telas: cabeçalho e menus são do <bulbe-app>.
   Mesma estrutura das telas do grupo (HU01); medidas e cores lidas no Figma. */
.atendimento-page { margin: 0; font-family: Inter, Arial, sans-serif; color: #24263c; line-height: 1.45; }
.atendimento-page * { box-sizing: border-box; }
.iphone-se__screen { position: relative; }

.atendimento-hero--detail .atendimento-hero__label { font-size: 11px; line-height: 13px; margin-bottom: 4px; }
.atendimento-hero--detail h1 { font-size: 28px; line-height: 34px; }
.atendimento-hero--detail .atendimento-hero__subtitle { margin-top: 7px; font-size: 13px; line-height: 16px; font-weight: 400; }
.atendimento-hero--estado { min-height: 149px; }

/* seta de voltar no lugar do botão de menu (telas internas do Figma) */
.atendimento-voltar { position: absolute; z-index: 5; left: 12px; top: 12px; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 8px; background: #1308a1; color: white; }
.atendimento-voltar svg { width: 24px; height: 24px; }

.atendimento-stack { position: relative; display: flex; flex-direction: column; gap: 12px; margin-top: -42px; padding: 0 24px 32px; }
.atendimento-card { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 20px; border-radius: 24px; background: white; }
.atendimento-card h2 { margin: 0; font-size: 18px; line-height: 26px; color: #24263c; }
.atendimento-card h2.atendimento-titulo { color: #086c83; }
.atendimento-card p { margin: 0; font-size: 14px; }
.atendimento-card .atendimento-note { font-size: 12px; color: #626779; }
.atendimento-card .atendimento-assunto { font-size: 15px; font-weight: 600; }
.atendimento-card--cream { background: #fff9ed; box-shadow: 0 6px 0 -2px #24263c14; }
.atendimento-card--raised { box-shadow: 0 6px 0 -2px #24263c14; }
.atendimento-card--warning { background: #fff1d9; }

/* linhas de ação (ícone, título e seta) */
.atendimento-shortcut { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: white; text-decoration: none; color: #086c83; }
.atendimento-shortcut__icon { display: grid; place-items: center; flex: 0 0 36px; height: 36px; border-radius: 12px; background: #e2f3f7; }
.atendimento-shortcut__icon img { width: 24px; height: 24px; }
.atendimento-shortcut__text { flex: 1; min-width: 0; }
.atendimento-shortcut strong { display: block; font-size: 14px; font-weight: 600; }
.atendimento-shortcut small { display: block; margin-top: 4px; color: #626779; font-size: 12px; }
.atendimento-shortcut__arrow { width: 12px; height: 20px; }
.atendimento-shortcut--purple { color: #7141ad; }
.atendimento-shortcut--purple .atendimento-shortcut__icon { background: #f0e8fa; }

/* pílulas */
.atendimento-pill { display: block; padding: 10px; border-radius: 12px; background: #ece9ff; color: #1308a1; font-size: 12px; font-weight: 600; }
.atendimento-pill--situacao { background: #fff1d9; color: #24263c; text-transform: uppercase; }

.atendimento-rows { display: flex; flex-direction: column; gap: 12px; margin: 0; }
.atendimento-rows > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font-size: 13px; }
.atendimento-rows dt { color: #626779; }
.atendimento-rows dd { margin: 0; text-align: right; font-weight: 600; white-space: nowrap; }
.atendimento-steps { display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.atendimento-strong { font-size: 13px; font-weight: 600; }
.atendimento-text-action { font-size: 13px; font-weight: 600; color: #1308a1; text-decoration: none; }

/* botões (estado Andamento indisponível) */
.atendimento-button { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 16px; border-radius: 16px; background: #1308a1; color: white; font-size: 14px; font-weight: 600; text-decoration: none; }
.atendimento-button--soft { background: #ece9ff; color: #1308a1; }

.atendimento-disclaimer { margin: 8px 0 0; color: #626779; font-size: 11px; }
.atendimento-page a:focus-visible { outline: 3px solid #ffb400; outline-offset: 4px; }

/* aviso curto quando uma área do menu pertence a outra história */
.atendimento-aviso { position: absolute; left: 50%; bottom: 96px; z-index: 20; width: max-content; max-width: calc(100% - 32px); margin: 0; padding: 12px 18px; border-radius: 14px; background: #24263c; color: white; font: 400 12.5px/1.45 Inter, Arial, sans-serif; text-align: center; opacity: 0; transform: translate(-50%, 12px); transition: opacity .2s, transform .2s; pointer-events: none; }
.atendimento-aviso--visivel { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .atendimento-aviso { transition: none; } }
@media (max-width: 350px) {
  .atendimento-hero { padding-left: 20px; padding-right: 20px; }
  .atendimento-hero h1 { font-size: 27px; }
  .atendimento-hero--detail h1 { font-size: 24px; }
  .atendimento-stack { padding-left: 16px; padding-right: 16px; }
}


.hu06-telas { position: fixed; top: 24px; left: calc(50% + 230px); z-index: 5; display: grid; gap: 4px; width: 260px; padding: 14px; border-radius: 14px; background: white; box-shadow: 0 4px 20px #1018271a; font: 400 13px/1.4 Inter, Arial, sans-serif; color: #24263c; }
.hu06-telas strong { margin-bottom: 4px; font-size: 13px; }
.hu06-telas a { padding: 7px 10px; border-radius: 10px; color: #24263c; text-decoration: none; }
.hu06-telas a:hover { background: #f1f0ea; }
.hu06-telas a[aria-current] { background: #ece9ff; color: #1308a1; font-weight: 600; }

/* ===== Mapa de telas (igual ao quadro do Figma) ===== */
.hu06-modos { position: fixed; top: 16px; left: 50%; z-index: 30; display: flex; gap: 4px; padding: 4px; transform: translateX(-50%); border-radius: 999px; background: white; box-shadow: 0 4px 20px #1018271a; font: 600 13px/1 Inter, Arial, sans-serif; }
.hu06-modos a { padding: 10px 16px; border-radius: 999px; color: #24263c; text-decoration: none; }
.hu06-modos a[aria-current] { background: #1308a1; color: white; }
#mapa { display: none; }
body.modo-mapa { display: block; padding: 0; }
body.modo-mapa #mapa { display: grid; grid-template-columns: repeat(3, max-content); gap: 28px 56px; justify-content: center; padding: 88px 40px 56px; }
body.modo-mapa .iphone-se--unico, body.modo-mapa .hu06-telas { display: none; }
body:not(.modo-mapa) .hu06-modos { left: 24px; transform: none; }
.mapa__quadro { margin: 0; scroll-margin: 80px; }
.mapa__quadro figcaption { margin: 0 0 10px 6px; font: 600 14px/1.3 Inter, Arial, sans-serif; color: #626779; }
.mapa__titulo { grid-column: 1 / -1; margin: 28px 0 -8px 6px; font: 700 16px/1.3 Inter, Arial, sans-serif; color: #24263c; }
.mapa__titulo small { display: block; margin-top: 2px; font-weight: 400; font-size: 13px; color: #626779; }
.mapa__quadro--alvo .iphone-se { outline: 4px solid #1308a1; outline-offset: 6px; transition: outline-color .3s; }
.mapa__quadro .iphone-se__screen { position: relative; }
@media (max-width: 1300px) { body.modo-mapa #mapa { grid-template-columns: max-content; } }

  <script>
/* ===== Template do grupo: componente <bulbe-app> ===== */
(() => {
if (customElements.get('bulbe-app')) return;
const asset = (name) => window.__BULBE_IMG[name];
const areas = [
  { id: 'faturas', label: 'Minhas contas', description: 'Fatura atual e histórico', icon: 'faturas.svg', tab: 'Faturas' },
  { id: 'economia', label: 'Minha economia', description: 'Resultado, cálculo e evolução', icon: 'economia.svg', tab: 'Economia', tabIcon: 'tab-economia.svg', chevron: 'chevron-green.svg' },
  { id: 'contrato', label: 'Minha contratação', description: 'Condições e documento', icon: 'contrato.svg', tab: 'Contrato', tabIcon: 'tab-contrato.svg', chevron: 'chevron-purple.svg' },
  { id: 'servico', label: 'Como funciona a Bulbe', description: 'Explicação do serviço', icon: 'servico.svg' },
  { id: 'duas-contas', label: 'Entenda suas contas', description: 'Cobranças Bulbe e distribuidora', icon: 'duas-contas.svg' },
  { id: 'ajuda', label: 'Atendimento', description: 'Contato, protocolo e cancelamento', icon: 'ajuda.svg', tab: 'Ajuda', tabIcon: 'tab-ajuda.svg', chevron: 'chevron-teal.svg' },
  { id: 'indicacoes', label: 'Indique e ganhe', description: 'Compartilhe a Bulbe com amigos', icon: 'indicacoes.svg', chevron: 'chevron-green.svg' },
];

const brand = `<span class="brand" role="img" aria-label="Bulbe">
  <img class="brand__letters" src="${asset('logo-original.png')}" alt="">
  <img class="brand__rays" src="${asset('logo-original.png')}" alt="">
</span>`;

class BulbeApp extends HTMLElement {
  static observedAttributes = ['profile-initial', 'active-area'];

  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
    this.shadowRoot.innerHTML = `
      <style>${window.__BULBE_CSS}</style>
      <div class="app-page">
        <header class="app-header">
          <div class="topbar">
            <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-controls="app-menu" aria-expanded="false">
              <img src="${asset('menu.svg')}" alt="">
            </button>
            ${brand}
            <span class="profile" aria-label="Perfil de demonstração"></span>
          </div>
        </header>
        <main id="app-content" tabindex="-1"><slot></slot></main>
        <nav class="bottom-nav" aria-label="Navegação principal">
          ${areas.filter((area) => area.tab).map((area) => `
            <button class="tab" type="button" data-area="${area.id}" aria-pressed="false">
              <img class="icon" src="${asset(area.tabIcon || area.icon)}" alt="">
              <span>${area.tab}</span>
            </button>`).join('')}
        </nav>
      </div>
      <div class="menu-layer" id="app-menu" role="dialog" aria-modal="true" aria-labelledby="menu-heading" hidden>
        <div class="drawer">
          <header class="drawer-header">
            <img class="header-sun" src="${asset('drawer-sun.svg')}" alt="">
            ${brand}
            <p class="section-label">TODAS AS ÁREAS</p>
            <h2 id="menu-heading">Menu</h2>
            <p>Escolha para onde ir.</p>
            <button class="close-menu" type="button" aria-label="Fechar menu"><img src="${asset('close.svg')}" alt=""></button>
          </header>
          <nav class="drawer-nav" aria-label="Todas as áreas">
            ${areas.map((area) => `
              <button class="drawer-link" type="button" data-area="${area.id}">
                <span class="drawer-link__icon"><img class="icon" src="${asset(area.icon)}" alt=""></span>
                <span class="drawer-link__text"><strong>${area.label}</strong><small>${area.description}</small></span>
                <img class="drawer-link__chevron" src="${asset(area.chevron || 'chevron.svg')}" alt="">
              </button>`).join('')}
          </nav>
        </div>
      </div>`;
    this.page = this.shadowRoot.querySelector('.app-page');
    this.menu = this.shadowRoot.querySelector('.menu-layer');
    this.toggle = this.shadowRoot.querySelector('.menu-toggle');
    this.closeButton = this.shadowRoot.querySelector('.close-menu');
    this.toggle.addEventListener('click', () => this.openMenu());
    this.closeButton.addEventListener('click', () => this.closeMenu());
    this.menu.addEventListener('click', (event) => {
      if (event.target === this.menu) this.closeMenu();
    });
    this.shadowRoot.addEventListener('click', (event) => {
      const button = event.target.closest('[data-area]');
      if (!button) return;
      const area = button.dataset.area;
      this.setAttribute('active-area', area);
      this.closeMenu();
      this.dispatchEvent(new CustomEvent('bulbe:navigate', { detail: { area }, bubbles: true, composed: true }));
    });
    this.menu.addEventListener('keydown', (event) => this.handleMenuKey(event));
  }

  connectedCallback() { this.update(); }
  attributeChangedCallback() { if (this.page) this.update(); }

  update() {
    this.shadowRoot.querySelector('.profile').textContent = this.getAttribute('profile-initial') || 'M';
    const active = this.getAttribute('active-area') || 'faturas';
    const tabArea = active === 'duas-contas' ? 'faturas' : active;
    for (const button of this.shadowRoot.querySelectorAll('.tab')) {
      button.setAttribute('aria-pressed', String(button.dataset.area === tabArea));
    }
    for (const button of this.shadowRoot.querySelectorAll('.drawer-link')) {
      if (button.dataset.area === active) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    }
  }

  openMenu() {
    this.menu.hidden = false;
    this.page.inert = true;
    this.toggle.setAttribute('aria-expanded', 'true');
    this.closeButton.focus();
  }

  closeMenu() {
    if (this.menu.hidden) return;
    this.menu.hidden = true;
    this.page.inert = false;
    this.toggle.setAttribute('aria-expanded', 'false');
    this.toggle.focus();
  }

  handleMenuKey(event) {
    if (event.key === 'Escape') {
      event.preventDefault();
      this.closeMenu();
    }
    if (event.key !== 'Tab') return;
    const buttons = [...this.menu.querySelectorAll('button')];
    const first = buttons[0];
    const last = buttons.at(-1);
    const current = this.shadowRoot.activeElement;
    if (event.shiftKey && current === first) {
      event.preventDefault(); last.focus();
    } else if (!event.shiftKey && current === last) {
      event.preventDefault(); first.focus();
    }
  }
}

if (!customElements.get('bulbe-app')) customElements.define('bulbe-app', BulbeApp);
})();

const NOMES = [["atendimento", "HU06 • Atendimento"], ["sem-pedidos", "ESTADO • Atendimento (sem pedidos)"], ["solicitacao", "HU06 • Minha solicitação"], ["indisponivel", "ESTADO • Andamento indisponível"], ["cancelar", "HU06 • Cancelar assinatura"]];
const app = document.querySelector('bulbe-app');
const raiz = document.querySelector('#hu06-raiz');
const voltar = document.querySelector('#hu06-voltar');

function mostrar(texto, celular = document.querySelector('.iphone-se--unico .iphone-se__screen')) {
  const aviso = celular._aviso ??= Object.assign(document.createElement('p'), { className: 'atendimento-aviso', role: 'status' });
  if (!aviso.isConnected) celular.append(aviso);
  aviso.textContent = texto;
  aviso.classList.add('atendimento-aviso--visivel');
  clearTimeout(aviso._t);
  aviso._t = setTimeout(() => aviso.classList.remove('atendimento-aviso--visivel'), 3200);
}

function desenhar() {
  const [caminho, consulta = ''] = location.hash.replace(/^#\/?/, '').split('?');
  const mapa = !TELAS[caminho];
  document.body.classList.toggle('modo-mapa', mapa);
  document.querySelector('#modo-mapa').toggleAttribute('aria-current', mapa);
  document.querySelector('#modo-uma').toggleAttribute('aria-current', !mapa);
  if (mapa) { document.title = 'Bulbe | HU06 • Mapa de telas'; return; }
  const chave = TELAS[caminho] ? caminho : 'atendimento';
  const tela = TELAS[chave];
  raiz.innerHTML = tela.html;
  voltar.hidden = !tela.interna;
  document.title = 'Bulbe | ' + tela.titulo.replace(/^(HU06|ESTADO) • /, '');
  document.querySelector('#hu06-telas').innerHTML = '<strong>Telas da HU06</strong>' + NOMES.map(([c, n]) => `<a href="#/${c}"${c === chave ? ' aria-current="page"' : ''}>${n}</a>`).join('');
  const principal = app.shadowRoot?.querySelector('main');
  if (new URLSearchParams(consulta).get('ir') === 'canais') raiz.querySelector('#canais')?.scrollIntoView({ block: 'start' });
  else principal?.scrollTo(0, 0);
}

document.addEventListener('click', (evento) => {
  if (!evento.target.closest('[data-outra-historia]')) return;
  evento.preventDefault();
  mostrar('Minhas condições ficam na área Contrato, de outra história do squad.', evento.target.closest('.iphone-se__screen'));
});
app.addEventListener('bulbe:navigate', (evento) => {
  if (evento.detail.area === 'ajuda') { location.hash = '#/atendimento'; return; }
  app.setAttribute('active-area', 'ajuda');
  mostrar('Esta área é de outra história do squad (fora da HU06).');
});

// ===== Mapa de telas: as cinco telas lado a lado, como no Figma, interativas entre si =====
const QUADROS = [
  ['cancelar', 'HU06 / Cancelar assinatura'], ['atendimento', 'HU06 / Atendimento'], ['solicitacao', 'HU06 / Minha solicitação'],
  ['sem-pedidos', 'ESTADO • Atendimento (sem pedidos)'], ['indisponivel', 'ESTADO • Andamento indisponível'],
];
const mapaEl = document.querySelector('#mapa');
function irPara(chave, ancora) {
  const quadro = document.querySelector('#quadro-' + chave);
  if (!quadro) return;
  quadro.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
  quadro.classList.add('mapa__quadro--alvo');
  setTimeout(() => quadro.classList.remove('mapa__quadro--alvo'), 1400);
  if (ancora) setTimeout(() => quadro.querySelector('#m-' + chave + '-' + ancora)?.scrollIntoView({ block: 'start' }), 350);
}
QUADROS.forEach(([chave, nome], indice) => {
  if (indice === 3) mapaEl.insertAdjacentHTML('beforeend', '<h2 class="mapa__titulo">ESTADOS ALTERNATIVOS<small>Exemplos de situações, sem novas etapas de navegação.</small></h2>');
  const tela = TELAS[chave];
  const corpo = tela.html
    .replace(/\b(id|aria-labelledby)="([^"]+)"/g, (_, atributo, valor) => `${atributo}="m-${chave}-${valor}"`)
    .replace(/href="#canais"/g, 'href="#/atendimento?ir=canais"');
  mapaEl.insertAdjacentHTML('beforeend', `<figure class="mapa__quadro" id="quadro-${chave}"><figcaption>${nome}</figcaption>
    <div class="iphone-se" aria-label="Prévia em iPhone SE"><div class="iphone-se__speaker" aria-hidden="true"></div>
      <div class="iphone-se__screen"><bulbe-app profile-initial="${chave === 'indisponivel' ? 'J' : chave === 'sem-pedidos' ? 'A' : 'M'}" active-area="ajuda"><article class="atendimento-page">${corpo}</article></bulbe-app>
      ${tela.interna ? `<a class="atendimento-voltar" href="#/atendimento" aria-label="Voltar para Atendimento">${document.querySelector('#hu06-voltar').innerHTML}</a>` : ''}</div>
      <div class="iphone-se__home" aria-hidden="true"></div></div></figure>`);
  const celular = mapaEl.querySelector('#quadro-' + chave);
  celular.querySelector('bulbe-app').addEventListener('bulbe:navigate', (evento) => {
    if (evento.detail.area === 'ajuda') { irPara('atendimento'); return; }
    celular.querySelector('bulbe-app').setAttribute('active-area', 'ajuda');
    mostrar('Esta área é de outra história do squad (fora da HU06).', celular.querySelector('.iphone-se__screen'));
  });
});
mapaEl.addEventListener('click', (evento) => {
  const link = evento.target.closest('a[href^="#/"]');
  if (!link) return;
  evento.preventDefault();
  const [chave, consulta = ''] = link.getAttribute('href').slice(2).split('?');
  irPara(chave, new URLSearchParams(consulta).get('ir'));
});
window.addEventListener('hashchange', desenhar);
desenhar();
  </script>
